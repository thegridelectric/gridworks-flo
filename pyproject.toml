[project]
name = "gridworks-flo"
version = "0.0.1"
description = "GridWorks FLO service — answers an LTN's flo.params with a flo.recommendation over the broker."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "GridWorks", email = "gridworks@gridworks-consulting.com" },
]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "gridworks-base>=0.6.2",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# The bruce optimizer, from its private repo. A deploy installs it
# (`uv sync --frozen --extra bruce`); without it the service answers
# alice and refuses bruce requests, which is what CI runs.
bruce = ["bruce-energy"]

[project.scripts]
gwflo = "gwflo.cli:main"

[project.urls]
Homepage = "https://github.com/thegridelectric/gridworks-flo"
Repository = "https://github.com/thegridelectric/gridworks-flo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwflo"]

[tool.uv.sources]
# bruce is pinned to a tag on the GridWorks fork of optimal-flexibility,
# so the lock resolves anywhere and a box installs that exact optimizer.
# To work on bruce itself: `uv pip install -e ../optimal-flexibility`
# after `uv sync` (the next sync restores the pin).
bruce-energy = { git = "https://github.com/thegridelectric/optimal-flexibility", tag = "v0.1.0+gw1" }

[dependency-groups]
dev = [
    "paho-mqtt>=2.1",
    "pyright>=1.1.408",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.5.6",
]

[tool.pytest.ini_options]
markers = [
    "broker: needs the gwbase dev broker on localhost:5672 and its MQTT door on 1885",
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/gwflo/sema"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "src/gwflo/sema",
]
output-format = "concise"
fix = true
show-fixes = true

[tool.ruff.format]
preview = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
preview = true
