# Seed request for gridworks-flo (gwflo).
#
# Regenerated by scripts/regen_sema_snapshot.sh, one call to
# `sema snapshot regen` on this file; `package_name` and `vendor_dir` say
# where the snapshot goes. The words on the FLO boundary: the request and
# its two answers, the recommendation and the refusal. The closure brings the tuning words (whose TypeName
# selects the FLO), the optimal path, the unitless PQ pair and the refusal
# reason.

package_name: gwflo
vendor_dir: sema

initial_targets:
  types:
    flo.params:
      versions: ["005"]
    flo.recommendation:
      versions: ["003"]
    flo.refusal:
      versions: ["000"]

# Local class/module names drop the gw ceremony inside this package.
local_names:
  strip_prefixes: [gw1, gw]
